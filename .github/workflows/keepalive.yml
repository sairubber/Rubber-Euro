# Pings the Render backend every ~10 minutes so the free instance never
# spins down — the 24/7 scraper keeps scraping and visitors never hit the
# ~50s cold start. GitHub may delay scheduled runs by a few minutes and
# disables schedules after 60 days without repo activity (any commit
# re-enables them).
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -sS --max-time 90 "https://rubber-euro-backend.onrender.com/api/health" || true
          curl -sS --max-time 30 -o /dev/null "https://rubber-euro.vercel.app" || true
