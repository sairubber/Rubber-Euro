# Render Blueprint — backend API only (the frontend deploys on Vercel).
# Import at https://dashboard.render.com → New → Blueprint → this repo.
#
# The backend cannot run on Vercel: it needs an always-on process (the 24/7
# scraper/scheduler) and a writable SQLite file — serverless provides neither.
#
# Free plan notes:
# - Sleeps after ~15 min without traffic; wakes on the next visit (~30-60s).
#   While asleep the scraper pauses; on wake the app re-fetches everything.
# - No persistent disk on free: SQLite resets on each deploy and the startup
#   jobs repopulate it. Paid plan + disk at /var/data (with
#   DATABASE_URL=sqlite:////var/data/market_intel.db) keeps the archive and
#   scrapes truly 24/7.
services:
  - type: web
    name: rubber-euro-backend
    runtime: python
    plan: free
    rootDir: market-intel-v2/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL in the dashboard, e.g. https://rubber-euro.vercel.app
