# Render Blueprint — deploys the WHOLE site (backend API + frontend) in one
# shot. Import at https://dashboard.render.com → New → Blueprint → this repo.
#
# Why not Vercel for everything: the backend needs an always-on process (the
# 24/7 scraper/scheduler) and a writable SQLite file — serverless platforms
# provide neither. Render runs it as a real server; the frontend deploys
# alongside it as a static site.
#
# Free plan notes:
# - The backend sleeps after ~15 min without traffic and wakes on the next
#   visit (first request after a sleep takes ~30-60s). While asleep the
#   scraper pauses; on wake the app re-fetches everything itself.
# - No persistent disk on free: the SQLite file resets on each deploy and
#   the startup jobs repopulate it. The paid plan (+ a disk mounted at
#   /var/data with DATABASE_URL=sqlite:////var/data/market_intel.db) keeps
#   the archive across deploys and scrapes truly 24/7.
#
# If Render assigns different URLs than the ones below (it suffixes names
# that are taken), update VITE_API_URL and CORS_ORIGINS in each service's
# Environment tab and redeploy.
services:
  - type: web
    name: rubber-euro-backend
    runtime: python
    plan: free
    rootDir: market-intel-v2/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        value: https://rubber-euro-site.onrender.com

  - type: web
    name: rubber-euro-site
    runtime: static
    rootDir: market-intel-v2/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://rubber-euro-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
